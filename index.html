<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./src/assets/sgv/logo_vet.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>culturapmw</title>
    <!-- Aplica o tema salvo antes de desenhar a página (evita piscar branco) -->
    <script>
      (function () {
        var tema = 'claro'
        try {
          tema = localStorage.getItem('culturapmw:tema')
          if (tema !== 'claro' && tema !== 'escuro') {
            tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', tema)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
